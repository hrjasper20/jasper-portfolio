<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: without it every env(safe-area-inset-*) the phone
         shell pads with is 0. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Jasper Dio | GoHighLevel VA and AI Automation Specialist</title>
    <meta name="description" content="John Jasper Dio, a GoHighLevel VA and AI automation specialist in the Philippines. Seven builds you can open, skills linked to proof, and your working hours in Philippine time." />
    <meta name="author" content="John Jasper Dio" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <!-- The browser bar takes the page colour (--cream per theme); the inline
         theme script below and lib/theme.ts keep it in step with the toggle.
         Literal hex here only because this runs before any stylesheet loads. -->
    <meta name="theme-color" content="#EAF2EE" />
    <!-- Lives at jasperdio.vercel.app/hire, beside the client site at the root
         (vite.config.ts base, src/lib/base.ts). Link previews need full https:// URLs. -->
    <link rel="canonical" href="https://jasperdio.vercel.app/hire/" />

    <link rel="icon" type="image/svg+xml" href="/hire/jasper/logo-jd.svg" />

    <!-- nosniff and the other security headers are set in vercel.json; a meta
         tag cannot set them. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- The rail avatar is above the fold on every desktop route. Keep this in
         sync with profile.avatarSrc in src/data/profile.ts. -->
    <link rel="preload" as="image" href="/hire/jasper/photo.webp" fetchpriority="high" media="(min-width: 1100px)" />

    <!-- Open Graph / social share. public/og-image.jpg is this site's own
         preview (scripts/og-image.mjs); it used to borrow the main site's. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Jasper Dio" />
    <meta property="og:title" content="Jasper Dio | GoHighLevel VA and AI Automation Specialist" />
    <meta property="og:description" content="Seven GoHighLevel, n8n and AI builds you can open, skills linked to proof, and your working hours in Philippine time." />
    <meta property="og:url" content="https://jasperdio.vercel.app/hire/" />
    <meta property="og:image" content="https://jasperdio.vercel.app/hire/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Jasper Dio, AI Automation Specialist: GoHighLevel, n8n and AI tools." />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Theme before first paint: no flash of the wrong palette. Default is
         light; dark is the visitor's opt-in, persisted in localStorage. -->
    <script>
      (function () {
        try {
          document.documentElement.dataset.theme =
            localStorage.getItem('theme') === 'dark' ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
        if (document.documentElement.dataset.theme === 'dark') {
          var bar = document.querySelector('meta[name="theme-color"]');
          if (bar) bar.setAttribute('content', '#182833');
        }
        // The site's own "reduce motion" switch (lib/a11y.ts), early enough
        // for the start-up loader below to hold still.
        try {
          if (JSON.parse(localStorage.getItem('kv-a11y') || '{}').motion) {
            document.documentElement.dataset.a11yMotion = 'true';
          }
        } catch (e) {}
      })();
    </script>
    <noscript><style>#boot { display: none; }</style></noscript>
    <script type="module" crossorigin src="/hire/assets/index-CS09qdxL.js"></script>
    <link rel="stylesheet" crossorigin href="/hire/assets/index-BMA66o3Q.css">
  </head>
  <body>
    <!-- Start-up loader (2026-10-07): the JD mark with a light running along
         its one stroke, painted with the first frame while the app downloads
         (cold loads showed a blank page). Styles: src/styles/boot.css. Run by
         src/components/IntroOverlay.tsx, which turns it into the intro on
         Home's first visit or fades it once the page has rendered. The path
         is JD_PATH in src/components/JdMark.tsx; keep the two in step. -->
    <div id="boot" class="jd-intro">
      <div class="jd-intro__mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" focusable="false">
          <defs><path id="jd-p" d="M11 29a6 6 0 0 0 12 0V13h3a11 11 0 0 1 0 22h-9" /></defs>
          <circle cx="24" cy="24" r="24" />
          <use class="jd-intro__track" href="#jd-p" />
          <path class="jd-intro__ink" d="M11 29a6 6 0 0 0 12 0V13h3a11 11 0 0 1 0 22h-9" />
        </svg>
        <span class="jd-intro__run">
          <svg viewBox="0 0 48 48" style="--i: 0"><use href="#jd-p" /></svg>
          <svg viewBox="0 0 48 48" style="--i: 1"><use href="#jd-p" /></svg>
          <svg viewBox="0 0 48 48" style="--i: 2"><use href="#jd-p" /></svg>
          <svg viewBox="0 0 48 48" style="--i: 3"><use href="#jd-p" /></svg>
          <svg viewBox="0 0 48 48" style="--i: 4"><use href="#jd-p" /></svg>
          <svg viewBox="0 0 48 48" style="--i: 5"><use href="#jd-p" /></svg>
          <svg viewBox="0 0 48 48" style="--i: 6"><use href="#jd-p" /></svg>
          <svg viewBox="0 0 48 48" style="--i: 7"><use href="#jd-p" /></svg>
          <svg viewBox="0 0 48 48" style="--i: 8"><use href="#jd-p" /></svg>
          <svg viewBox="0 0 48 48" style="--i: 9"><use href="#jd-p" /></svg>
          <svg viewBox="0 0 48 48" style="--i: 10"><use href="#jd-p" /></svg>
          <svg viewBox="0 0 48 48" style="--i: 11"><use href="#jd-p" /></svg>
        </span>
      </div>
      <p class="jd-intro__name" aria-hidden="true">Jasper Dio</p>
      <p class="jd-intro__slow">Still loading. <a href="">Reload the page</a></p>
    </div>
    <div id="root"></div>
  </body>
</html>
